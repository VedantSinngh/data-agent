[project]
name = "datatrust-agent"
version = "0.1.0"
description = "An evidence-grounded AI agent that detects data-quality issues, explains their business impact, and proposes validated, human-approved corrections."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn",
    "pandas",
    "numpy",
    "pydantic",
    "pytest",
    "sentence-transformers",
    "faiss-cpu",
    "rank-bm25",
    "pyyaml",
    "groq",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
